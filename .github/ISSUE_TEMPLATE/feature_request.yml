name: 💡 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请尽量描述**你实际遇到的场景**，而不只是想要的实现方式——
        这样更容易找到通用且不过度设计的方案。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 痛点
      description: 你现在是怎么做的？遇到什么不方便？
      placeholder: 我在做 XXX 的时候，不得不手动 YYY，很麻烦……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你试过别的办法吗？为什么不行？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 管理后台界面
        - OpenAI 网关（鉴权 / 路由 / 流式）
        - 上下文保护 / 裁剪
        - 工具调用（Agent）
        - 用量统计 Dashboard
        - 模型 / 引擎进程管理
        - 权限与账户
        - 部署 / 打包
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与 README，确认这不是已有功能或已规划事项
          required: true
